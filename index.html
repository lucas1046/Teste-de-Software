<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Formulário Profissional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h2>Cadastro</h2>
    <div id="statusGeral" class="msg success"></div>

    <form id="meuForm" novalidate>
        <div class="form-group">
            <input type="text" id="nome" placeholder="Seu nome">
            <div id="erroNome" class="msg error"></div>
        </div>

        <div class="form-group">
            <input type="email" id="email" placeholder="Seu e-mail">
            <div id="erroEmail" class="msg error"></div>
        </div>

        <button type="submit" class="btn-submit">Enviar Cadastro</button>
    </form>
</div>

    <script src="script.js"></script>
</body>
</html>

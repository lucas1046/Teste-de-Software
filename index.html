<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Teste de Formulário</title>
<style>
body { font-family: Arial; text-align: center; margin-top: 50px; }
input { padding: 8px; margin: 5px; }
#mensagem { color: red; font-weight: bold; }
</style>
</head>
<body>
<h2>Formulário de Teste</h2>
<input type="text" id="nome" placeholder="Digite seu nome">
<button onclick="validar()">Enviar</button>
<p id="mensagem"></p>
<script>
function validar() {
const nome = document.getElementById("nome").value;
const msg = document.getElementById("mensagem");
if (nome === "") {
msg.textContent = "Erro: o nome é obrigatório!";
} else {
msg.style.color = "green";
msg.textContent = "Formulário enviado com sucesso!";
}
}
</script>
</body>
</html>
